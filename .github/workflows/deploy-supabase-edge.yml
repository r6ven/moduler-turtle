name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "turtle-game/supabase/functions/**"
      - "turtle-game/supabase/config.toml"
      - "turtle-game/src/PuzzleDefinition.js"
      - "turtle-game/src/PuzzleGenerator.js"
      - "turtle-game/src/PuzzleReplayVerifier.js"
      - "turtle-game/src/PuzzleValidator.js"
      - "turtle-game/src/PuzzleRandom.js"
      - "turtle-game/src/RankedCalendar.js"
      - "turtle-game/src/RankedSprintConfig.js"
      - "turtle-game/src/HexMath.js"
      - "turtle-game/src/Tile.js"
      - ".github/workflows/deploy-supabase-edge.yml"

permissions:
  contents: read

jobs:
  deploy-ranked-functions:
    name: Deploy ranked Edge Functions
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: turtle-game

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: dcpmbjmjlaafrwzxlmsx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.116.0
          github-token: ${{ github.token }}

      - name: Deploy ranked Edge Functions
        run: |
          supabase functions deploy generate-ranked-season \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt
          supabase functions deploy submit-ranked-replay \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt
          supabase functions deploy finalize-ranked-day \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt
